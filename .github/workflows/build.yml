name: build

# What this is for: nothing in this project had ever run on Windows, which is
# the one platform its audience uses. A hosted runner settles the half of that a
# machine can settle — that it compiles, that the tests pass, and that a
# self-contained single file actually publishes.
#
# It settles none of the other half. Opening the window, loading a mod, reading
# a GLB in Blender, clicking a file picker and rendering both themes still need
# a person at a Windows desktop. A green run here is not that check.

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  build:
    strategy:
      # Both platforms report, rather than the first failure hiding the other.
      # A Windows-only fault is the whole reason this exists, and it would be
      # cancelled by a Linux one under the default.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      # Before the checkout, because it decides how the checkout writes files.
      # Git for Windows rewrites LF to CRLF on the way to the working tree by
      # default, which changes the bytes of every text file the build embeds —
      # spec_vectors.json among them. A test comparing content it read from a
      # resource then fails on Windows and nowhere else, for a reason nothing in
      # the diff shows.
      - name: Check out the same bytes on both platforms
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Which SDK actually got picked. A build that behaves differently on the
      # two runners is worth being able to attribute, and this is the first
      # thing you want when it does.
      - name: Say which SDK this is
        run: dotnet --info

      - name: Restore
        run: dotnet restore

      # Warnings are errors, set in Directory.Build.props. On a platform nobody
      # had compiled for that is a real claim rather than a formality: path
      # handling and file APIs differ enough to produce new ones.
      - name: Build
        run: dotnet build --no-restore

      # The tests are run by executing the test assembly, not through
      # `dotnet test`. Two reasons, both about being able to act on a red run:
      #
      #  - `dotnet test` prints a count and writes the failing test names and
      #    their assertions to a UTF-16 log under TestResults that nobody would
      #    think to look for. The assembly writes them to stdout, which is the
      #    log you are already reading.
      #  - it removes a layer. `--no-build` coupling, the test-platform host and
      #    the SDK's runner all sit between the failure and the output, and none
      #    of them is what is being tested here.
      #
      # Asset-free by default: the DDS, PNG, SDF and editordata suites check the
      # readers against the game's own files, which cannot leave the author's
      # machine, so they skip here and must still be run locally. What does run
      # is every synthetic test, including the ones covering the atomic write
      # and the path-length guard — the two places where the platform is
      # actually load-bearing.
      - name: Test
        shell: bash
        run: |
          runner=tests/Perianth.Tests/bin/Debug/net10.0/Perianth.Tests
          if [ "$RUNNER_OS" = "Windows" ]; then runner="$runner.exe"; fi
          mkdir -p TestResults
          "$runner" \
            -noColor \
            -noLogo \
            -showLiveOutput \
            -xml TestResults/${{ matrix.rid }}.xml

      # Kept whether or not the run was green, because the interesting
      # comparison is usually between a red platform and the green one.
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.rid }}
          path: TestResults/
          if-no-files-found: warn

      # Trimmed, single-file, self-contained, per Directory.Build.props. This
      # also proves the trim stays clean on Windows specifically: a trim
      # warning is an error, and Windows pulls in a different set of framework
      # assemblies than Linux does.
      - name: Publish the command line
        run: dotnet publish src/Perianth.Cli -c Release -r ${{ matrix.rid }} --self-contained -o out/cli

      - name: Publish the window
        run: dotnet publish src/Perianth.Gui -c Release -r ${{ matrix.rid }} --self-contained -o out/gui

      # Only the two executables. Needing anything beside them is itself a
      # finding, so collecting only these is what keeps that honest instead of
      # hiding a loose DLL among the rest.
      #
      # Archived rather than uploaded bare, because a release asset carries no
      # file mode: a bare Linux binary arrives without its executable bit and
      # will not run.
      - name: Collect them (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p staging dist
          cp out/cli/perianth out/gui/perianth-gui staging/
          tar -czf dist/perianth-${{ matrix.rid }}.tar.gz -C staging .

      - name: Collect them (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging, dist | Out-Null
          Copy-Item out/cli/perianth.exe staging/
          Copy-Item out/gui/perianth-gui.exe staging/
          Compress-Archive -Path staging/* -DestinationPath dist/perianth-${{ matrix.rid }}.zip

      - uses: actions/upload-artifact@v7
        with:
          name: perianth-${{ matrix.rid }}
          path: dist/

  release:
    # Only for a version tag. Every other push builds and tests without
    # publishing anything, so a release is something you ask for by tagging
    # rather than something that happens to you.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: perianth-*
          merge-multiple: true
          path: dist

      # The GitHub CLI is already on the runner. A third-party action would be
      # one more thing to trust for a step that is one command.
      #
      # Two ways a tag arrives, and the difference is invisible from here. A tag
      # pushed on its own has no release yet, so one is created. A release
      # published in the browser creates the tag itself, so the release already
      # exists and `create` fails — attach the files to it instead. Without the
      # fallback the website route builds cleanly and then publishes nothing,
      # which looks like success everywhere except the page people download
      # from.
      #
      # GH_REPO because this job never checks the repository out — it only
      # downloads what the build made. Without a working tree gh has no git
      # remote to infer the repo from, and fails before it reaches GitHub at
      # all. Naming it is cheaper than a checkout done solely to be inferred
      # from.
      - name: Attach the downloads to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes dist/* \
            || gh release upload "$GITHUB_REF_NAME" dist/* --clobber
